# Khí hậu theo tháng (phiếu gcc29 vòng 5): lấy nốt các vị trí còn thiếu trong public/climate/monthly-v1.json bằng IP của
# GitHub (máy nhà dùng chung hạn mức Open-Meteo với job chụp đêm). Chế độ NỐI TIẾP: vị trí đã có trong tệp được dùng lại,
# mốc tuyến lấy từ data/climate-route-points.json, chỉ gọi archive-api cho phần thiếu (~104 lượt quy đổi/vị trí, giãn 100 s).
# Hết trần/hết hạn mức ngày thì commit phần đã lấy, lần sau làm tiếp. Khi `missing` không còn vị trí chưa lấy thì
# workflow TỰ TẮT lịch của nó (gh workflow disable). Commit bằng bot, deploy.yml build lại site để app có tệp mới.
name: Khí hậu theo tháng (nối tiếp)

on:
  schedule:
    - cron: '17 3 * * *'    # ~10:17 VN, xa giờ job chụp tối
  workflow_dispatch:
    inputs:
      budget:
        description: 'Trần lượt quy đổi Open-Meteo cho lần này'
        required: false
        default: '6000'

permissions:
  contents: write
  actions: write      # để tự tắt lịch khi đã đủ

concurrency:
  group: climate-monthly
  cancel-in-progress: false

jobs:
  climate:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Còn vị trí chưa lấy không?
        id: need
        run: |
          n=$(node -e "const f=require('./public/climate/monthly-v1.json');console.log(f.missing.filter(m=>!String(m.reason).startsWith('thiếu số mưa')).length)")
          echo "còn thiếu $n mục"
          echo "n=$n" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.need.outputs.n != '0'
        with:
          node-version: 20
          cache: npm
      - if: steps.need.outputs.n != '0'
        run: npm ci
      - name: Lấy phần thiếu (nối tiếp)
        id: run
        if: steps.need.outputs.n != '0'
        run: |
          set +e
          before=$(node -e "console.log(Object.keys(require('./public/climate/monthly-v1.json').locations).length)")
          npx --no-install vite-node scripts/climate-monthly.ts --budget "${{ github.event.inputs.budget || '6000' }}" --pace 100 --cache "$RUNNER_TEMP/climate-cache"
          rc=$?
          after=$(node -e "console.log(Object.keys(require('./public/climate/monthly-v1.json').locations).length)")
          echo "rc=$rc before=$before after=$after"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"; echo "gained=$((after-before))" >> "$GITHUB_OUTPUT"
          [ "$rc" = 3 ] && echo "::warning::còn thiếu vị trí (hết trần hoặc hạn mức), lần sau làm tiếp; lần này thêm $((after-before))"
          exit 0
      - name: Commit tệp khí hậu
        id: commit
        if: steps.need.outputs.n != '0'
        run: |
          git config user.name  "cloudhunter-verify[bot]"
          git config user.email "cloudhunter-verify[bot]@users.noreply.github.com"
          git add public/climate/monthly-v1.json data/climate-route-points.json
          git diff --cached --quiet && echo "không có gì mới" && exit 0
          git commit -m "khí hậu theo tháng: thêm ${{ steps.run.outputs.gained }} vị trí $(TZ=Asia/Ho_Chi_Minh date +%F) [bot]"
          for i in 1 2 3; do git pull --rebase origin main && git push && echo "pushed=1" >> "$GITHUB_OUTPUT" && exit 0; sleep 20; done
          exit 1
      - name: Build lại site (push bằng GITHUB_TOKEN không tự kích deploy.yml)
        if: steps.commit.outputs.pushed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
      - name: Đủ rồi thì tắt lịch
        if: steps.need.outputs.n == '0' || steps.run.outputs.rc == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable climate.yml --repo "$GITHUB_REPOSITORY" && echo "đã đủ vị trí, tắt lịch workflow này"
      - name: Đỏ job nếu lỗi hoặc không lấy thêm được gì
        if: steps.need.outputs.n != '0' && (steps.run.outputs.rc == '1' || steps.run.outputs.gained == '0')
        run: |
          echo "::error::climate-monthly rc=${{ steps.run.outputs.rc }}, thêm ${{ steps.run.outputs.gained }} vị trí"
          exit 1
