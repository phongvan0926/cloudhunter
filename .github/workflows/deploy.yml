name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # KHÔNG truyền GEMINI_API_KEY vào build: đây là site tĩnh công khai,
      # key nhúng vào bundle là ai cũng đọc được. Người dùng nhập key riêng
      # qua cửa sổ "🔑 API Key" trong app (lưu localStorage).
      - name: Install and Build
        run: |
          npm ci
          npm run build

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # gh-pages chỉ giữ 1 commit mới nhất, repo không phình theo thời gian
          force_orphan: true
